name: CI Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Check Code Quality (ESLint)
        run: npm run lint

      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Run Unit & Component Tests (Vitest)
        run: npm test
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://mock-project.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "mock-anon-key-ci"
          SUPABASE_SERVICE_ROLE_KEY: "mock-service-role-key-ci"
          GEMINI_API_KEY: "mock-gemini-key-ci"
          GROQ_API_KEY: "mock-groq-key-ci"

      - name: Production Build Validation
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://mock-project.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "mock-anon-key-ci"
          SUPABASE_SERVICE_ROLE_KEY: "mock-service-role-key-ci"
          GEMINI_API_KEY: "mock-gemini-key-ci"
          GROQ_API_KEY: "mock-groq-key-ci"
